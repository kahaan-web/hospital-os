name: hospital-os

services:
  postgres:
    image: postgres:16-alpine
    container_name: hospital-os-postgres
    restart: unless-stopped
    mem_limit: 512m
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-hos_dev_superuser}
      POSTGRES_DB: hospital_os
    command: ["postgres", "-c", "shared_buffers=96MB", "-c", "max_connections=40"]
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - hospital-os-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hospital_os"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  hospital-os-pgdata:
